name: macOS APFS migration

on:
  push:
    branches:
      - main
      - codex/multi-agent-apfs
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-apfs-volumes:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test on two separately mounted APFS volumes
        env:
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          scratch="$(mktemp -d "$RUNNER_TEMP/apfs-test.XXXXXX")"
          python -B tests/macos_ci.py --scratch "$scratch"
